# Builds Brass Lantern for all platforms and publishes a GitHub release.
#
# Runs on every push to main: if package.json carries a version that has no
# release yet, it builds Windows, macOS and Linux and creates the tag v<version>
# together with the release. Release notes come from docs/releases/v<version>.md.
# Pushing a tag v* or starting the workflow by hand works as well.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists – nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  linux-windows:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm ci
      - name: Build Linux and Windows
        run: |
          npx electron-builder --linux --win --publish never
          sh tools/build-win-installer.sh
      - name: Collect files
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir out
          cp "dist/Brass Lantern-$V.AppImage" "out/BrassLantern-$V-linux-x64.AppImage"
          cp "dist/brass-lantern_${V}_amd64.deb" out/
          cp "dist/Brass Lantern-$V-win.zip" "out/BrassLantern-$V-win-x64-portable.zip"
          cp "dist/BrassLantern-Setup-$V.exe" out/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: out/*

  mac:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build macOS (ad-hoc signed)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never -c.mac.identity=-
      - name: Collect files
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir out
          cp "dist/Brass Lantern-$V-arm64-mac.zip" "out/BrassLantern-$V-mac-arm64.zip"
          cp "dist/Brass Lantern-$V-mac.zip" "out/BrassLantern-$V-mac-intel.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/*

  release:
    needs: [prepare, linux-windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -f "docs/releases/$TAG.md" ]; then cp "docs/releases/$TAG.md" notes.md
          else echo "Brass Lantern $TAG" > notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Brass Lantern ${{ needs.prepare.outputs.tag }}
          body_path: notes.md
          make_latest: true
          files: files/*
